<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto | miperfumeria</title>
<meta name="description" content="Escríbenos por WhatsApp o el formulario de contacto para resolver dudas sobre disponibilidad, pedidos o mayoreo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
  <div class="hero-bg" data-bg="navy"></div>
  <div class="wrap">
    <h1>Contacto</h1>
    <p>Compra y coordina tu entrega por WhatsApp. También nos encuentras en Instagram y TikTok.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="cards-3" id="canales"></div>
  </div>
</section>

<section class="sec-bone">
  <div class="wrap-narrow">
    <div class="sec-head"><h2 class="sec-title">Escríbenos</h2>
      <p class="sec-sub">Dinos qué buscas y te respondemos con opciones concretas</p></div>
    <form onsubmit="event.preventDefault();toast('Mensaje enviado (demostración)');this.reset()">
      <div class="form-grid">
        <label class="field"><span>Nombre</span><input required placeholder="Tu nombre"></label>
        <label class="field"><span>WhatsApp o correo</span><input required placeholder="Para responderte"></label>
        <label class="field full"><span>Motivo</span>
          <select>
            <option>Quiero recomendación de un perfume</option>
            <option>Disponibilidad de un modelo</option>
            <option>Precio de mayoreo</option>
            <option>Estado de mi pedido</option>
            <option>Otro</option>
          </select></label>
        <label class="field full"><span>Mensaje</span><textarea rows="5" placeholder="Cuéntanos qué necesitas"></textarea></label>
      </div>
      <button class="btn btn-block" type="submit">Enviar mensaje</button>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/data-live.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
function pageInit(){
  document.querySelector("#canales").innerHTML = `
    <a class="info-card" href="${TIENDA.whatsapp}" target="_blank" rel="noopener">
      <div class="ico">${ICON.chat}</div><h3>WhatsApp</h3>
      <p>La vía más rápida para preguntar disponibilidad, apartar o pedir recomendación.</p></a>
    <a class="info-card" href="${TIENDA.instagram}" target="_blank" rel="noopener">
      <div class="ico">${ICON.ig}</div><h3>Instagram</h3>
      <p>${TIENDA.instagramUser} · Ahí publicamos llegadas nuevas y lo que queda en existencia.</p></a>
    <a class="info-card" href="${TIENDA.tiktok}" target="_blank" rel="noopener">
      <div class="ico">${ICON.tk}</div><h3>TikTok</h3>
      <p>@miperfumeriamx · Descubre nuestras fragancias.</p></a>`;
}
</script>
</body>
</html>
