<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto | miperfumeria</title>
<meta name="description" content="Perfume 100% original con garantía de autenticidad. Envío gratis desde 3 piezas y precio de mayoreo disponible.">
<meta property="og:type" content="product">
<meta property="og:site_name" content="miperfumeria">
<meta property="og:title" content="Producto | miperfumeria">
<meta property="og:description" content="Perfume 100% original con garantía de autenticidad. Envío gratis desde 3 piezas y precio de mayoreo disponible.">
<meta property="og:image" content="https://www.miperfumeria.com.mx/assets/img/editorial/hero-chrome.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="wrap">
  <div class="breadcrumb" id="crumb"></div>
  <div class="pdp" id="pdp"></div>
</div>

<div class="wrap">
  <div class="acc" id="acc"></div>
</div>

<section>
  <div class="wrap">
    <div class="sec-head"><h2 class="sec-title">También te puede gustar</h2></div>
    <div class="rail-wrap">
      <button class="rail-btn prev" aria-label="Anterior">‹</button>
      <div class="rail" id="railRel"></div>
      <button class="rail-btn next" aria-label="Siguiente">›</button>
    </div>
  </div>
</section>

<section class="sec-bone tight">
  <div class="wrap">
    <div class="service-strip">
      <div class="service-item"><b>Envío gratis</b><p>Llevando 3 piezas o más en el mismo pedido.</p></div>
      <div class="service-item"><b>Sellado de fábrica</b><p>Producto original con celofán y código de lote.</p></div>
      <div class="service-item"><b>Guía con rastreo</b><p>Enviamos con Skydrop y te compartimos el número.</p></div>
      <div class="service-item"><b>Te ayudamos a elegir</b><p>Escríbenos por WhatsApp antes de comprar.</p></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/data-live.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
function pageInit(){
  const id = params().get("id") || PRODUCTOS[0].id;
  const p = byId(id) || PRODUCTOS[0];
  const off = p.lista ? Math.round((1 - p.precio/p.lista)*100) : 0;
  document.title = p.marca + " " + p.nombre + " | miperfumeria";
  (function setMeta(){
    const titulo = p.marca + " " + p.nombre + " | miperfumeria";
    const desc = (p.desc || (p.marca + " " + p.nombre + ", perfume 100% original. Envío gratis desde 3 piezas y precio de mayoreo disponible.")).slice(0, 160);
    const url = location.origin + location.pathname + "?id=" + encodeURIComponent(p.id);
    const set = (sel, attr, val) => { const el = document.querySelector(sel); if(el) el.setAttribute(attr, val); };
    set('meta[name="description"]', "content", desc);
    set('meta[property="og:title"]', "content", titulo);
    set('meta[property="og:description"]', "content", desc);
    set('meta[property="og:image"]', "content", location.origin + "/" + p.imagen);
    let og = document.querySelector('meta[property="og:url"]');
    if(!og){ og = document.createElement("meta"); og.setAttribute("property", "og:url"); document.head.appendChild(og); }
    og.setAttribute("content", url);
    let canon = document.querySelector('link[rel="canonical"]');
    if(!canon){ canon = document.createElement("link"); canon.setAttribute("rel", "canonical"); document.head.appendChild(canon); }
    canon.setAttribute("href", url);
  })();

  document.querySelector("#crumb").innerHTML =
    `<a href="index.html">Inicio</a> / <a href="catalogo.html?f=${p.cat}">${p.cat==="arabe"?"Perfumes árabes":"Diseñador"}</a>
     / <a href="catalogo.html?m=${encodeURIComponent(p.marca)}">${p.marca}</a> / <span>${p.nombre}</span>`;

  document.querySelector("#pdp").innerHTML = `
    <div class="pdp-gallery pdp-gallery-single">
      <div class="pdp-main-img">${cardArt(p,true)}</div>
      <p class="image-caption">Imagen ilustrativa generada con IA para este maquetado.</p>
    </div>
    <div class="pdp-info">
      <div class="pdp-brand">${p.marca}</div>
      <h1>${p.nombre}</h1>
      <p class="pdp-intro">${p.contenido ? "Un regalo, un ritual completo." : "Tu próxima fragancia, a tu manera."}</p>

      <div class="price-row">
        <span class="price-now">${MONEDA(p.precio)}</span>
        ${p.lista?`<span class="price-was">${MONEDA(p.lista)}</span><span class="price-off">-${off}%</span>`:""}
      </div>
      <div class="sku">SKU ${p.id.toUpperCase()}${p.concentracion ? ' · '+p.concentracion : ''}</div>
      ${p.mayoreo ? `<div class="price-tiers" aria-label="Precios por tipo de compra">
        <div><span>Normal</span><b>${MONEDA(p.precio)}</b></div>
        <div><span>Mayoreo</span><b>${MONEDA(p.mayoreo)}</b></div>
        <div><span>Distribuidor</span><b>${MONEDA(p.distribuidor)}</b></div>
      </div><p class="tier-caption">Precios en MXN${p.contenido?' por set':''}. Mayoreo en pedidos desde $4,000. Consulta las condiciones de distribuidor.</p>` : ''}

      <div class="opt-group">
        <span class="lbl">Presentación</span>
        <div class="opts">
          <button class="opt is-on">${p.ml}</button>

        </div>
      </div>

      <div class="opt-group">
        <span class="lbl">Cantidad</span>
        <div class="qty" style="margin:0">
          <button onclick="pdpQty(-1)">−</button><span id="pdpQty">1</span><button onclick="pdpQty(1)">+</button>
        </div>
      </div>

      <div class="stock-line"><i class="dot"></i> ${stockText(p)}</div>

      <div id="deliveryChoice"></div>
      <div class="pdp-actions purchase-actions" id="productPurchase">${purchaseActions([{id:p.id,q:1}],p.id,true,true)}</div>
      ${p.stock!==0?`<button class="bag-secondary" onclick="addToCart('${p.id}', +document.getElementById('pdpQty').textContent)">Agregar a la bolsa para combinar perfumes</button>`:''}
      <p class="purchase-note">Te atendemos por WhatsApp para confirmar disponibilidad y entrega. Pago por transferencia.</p>

      <div class="usp-list">
        <div class="usp">${ICON.escudo}<div><b>100% original.</b> Producto sellado. Si no lo es, te devolvemos tu dinero.</div></div>
        <div class="usp">${ICON.camion}<div><b>Envío gratis desde 3 piezas.</b> Enviamos con Skydrop. Confirma el tiempo según tu destino.</div></div>
        <div class="usp">${ICON.billete}<div><b>Precio de mayoreo</b> en pedidos desde ${MONEDA(TIENDA.mayoreoMonto)}.</div></div>
        <div class="usp">${ICON.tarjeta}<div><b>Pago por transferencia.</b> Envía el comprobante por WhatsApp para su revisión.</div></div>
      </div>

      ${p.contenido ? `<div class="set-contents"><h3>Tu set incluye</h3><ul>${p.contenido.map(c=>`<li>${c}</li>`).join('')}</ul></div>` : ''}
      ${p.notas ? `<div class="notes-grid">
        <div class="note-box"><b>Notas de salida</b><p>${p.notas.s}</p></div>
        <div class="note-box"><b>Notas de corazón</b><p>${p.notas.c}</p></div>
        <div class="note-box"><b>Notas de fondo</b><p>${p.notas.f}</p></div>
      </div>` : ''}
    </div>`;

  document.querySelector("#acc").innerHTML = `
    <div class="acc-item is-on"><button class="acc-btn">Descripción <span class="sign">+</span></button>
      <div class="acc-panel"><p>${p.desc}</p>
      </div></div>
    <div class="acc-item"><button class="acc-btn">Duración y proyección <span class="sign">+</span></button>
      <div class="acc-panel"><p>La duración y la proyección varían según la fragancia, la piel y el clima. Escríbenos si quieres ayuda para elegir.</p>
      <p>Consejo: aplica sobre piel hidratada en cuello, muñecas y detrás de las orejas. No frotes después de aplicar.</p></div></div>
    <div class="acc-item"><button class="acc-btn">Envíos y entrega <span class="sign">+</span></button>
      <div class="acc-panel"><p>Enviamos con Skydrop, que integra Estafeta, FedEx, DHL, Redpack y Paquetexpress. El tiempo estimado se confirma según tu código postal. Recibes tu número de guía el mismo día del envío.</p>
      <p>Envío gratis en pedidos de 3 piezas o más.</p></div></div>
    <div class="acc-item"><button class="acc-btn">Garantía de autenticidad <span class="sign">+</span></button>
      <div class="acc-panel"><p>Todos los perfumes se venden sellados y con su código de lote visible. Si al recibirlo detectas cualquier señal de que no es original, lo recogemos sin costo y te reembolsamos el total.</p></div></div>`;

  const rel = PRODUCTOS.filter(x => x.id !== p.id && disponible(x) && (x.familia === p.familia || x.marca === p.marca)).slice(0,8);
  renderCards(rel.length ? rel : PRODUCTOS.filter(x=>disponible(x) && x.best), "#railRel");

  document.querySelectorAll(".pdp-thumbs button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".pdp-thumbs button").forEach(x=>x.classList.remove("is-on"));
    b.classList.add("is-on");
  }));
  document.querySelectorAll(".opts .opt").forEach(b => b.addEventListener("click", () => {
    b.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("is-on"));
    b.classList.add("is-on");
  }));
}
function pdpQty(d){
  const n = document.getElementById("pdpQty");
  const p=byId(params().get('id'))||PRODUCTOS[0];
  const max=p.stock ?? 99;
  if(+n.textContent+d>max){toast('Existencia disponible: '+max);return;}
  n.textContent = Math.max(1, Math.min(max,+n.textContent+d));
  document.getElementById("productPurchase").innerHTML=purchaseActions([{id:p.id,q:+n.textContent}],p.id,true,true);
}
</script>
</body>
</html>
