<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transferencia y WhatsApp | miperfumeria</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>


<div class="wrap"><div class="breadcrumb"><a href="catalogo.html">Catálogo</a> / <span>Transferencia</span></div></div>
<div class="plp-head"><div class="wrap"><h1>Tu compra, a un mensaje</h1><p>Consulta los datos de transferencia o continúa con atención personal por WhatsApp.</p></div></div>
<div class="wrap"><div class="checkout">
  <div><div id="deliveryChoice"></div><div id="transferContent"></div></div>
  <aside><div class="summary" id="sum"></div></aside>
</div></div>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/data-live.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
let pedidoConfirmado=null;
function onCartChange(){pedidoConfirmado=null;renderTransfer();}
function renderTransfer(){
  const content=document.getElementById('transferContent'), sum=document.getElementById('sum');
  if(!content)return;
  const items=selectedPurchase(), q=purchaseQuote(items);
  if(!q.lines.length){content.innerHTML='<div class="empty-state"><p>Selecciona un perfume para continuar.</p><a class="btn" href="catalogo.html">Ver catálogo</a></div>';sum.innerHTML='';return;}
  const bank=TIENDA.transferencia, ready=!!(bank.banco&&bank.beneficiario&&bank.cuenta);
  const autenticado=sbCustomerAuth.isAuthenticated();
  content.innerHTML=apartadoBanner()+`<section class="co-box transfer-box"><span class="eyebrow">PAGO POR TRANSFERENCIA</span><h2>Cuenta de transferencia</h2>
    ${ready?`<dl class="bank-details"><div><dt>Banco</dt><dd id="bankName"></dd></div><div><dt>Beneficiario</dt><dd id="bankOwner"></dd></div><div><dt id="bankType"></dt><dd id="bankAccount"></dd></div></dl><button class="btn btn-ghost" id="copyAccount" type="button">Copiar cuenta</button>`:'<dl class="bank-details bank-empty"><div><dt>Banco</dt><dd aria-label="Banco pendiente"></dd></div><div><dt>Beneficiario</dt><dd aria-label="Beneficiario pendiente"></dd></div><div><dt>CLABE o número de cuenta</dt><dd aria-label="Cuenta pendiente"></dd></div></dl><p class="purchase-note">Datos bancarios pendientes. Solicítalos al dueño por WhatsApp.</p>'}
    <p class="purchase-note">Antes de transferir, confirma la disponibilidad y el total según tu forma de entrega.</p>
    ${pedidoConfirmado?`<div class="confirm-check">
      <svg width="46" height="46" viewBox="0 0 52 52"><circle class="check-circle" cx="26" cy="26" r="24" fill="none"/><path class="check-mark" fill="none" d="M14 27l7 7 16-16"/></svg>
      <p><b>¡Cuenta y pedido confirmados!</b><br>Folio ${esc(pedidoConfirmado.id)} · Damián lo verá en el panel.</p>
    </div>`:`<button class="btn btn-block" id="confirmCheckout" type="button">Confirmar pedido y apartar 10 min para transferir</button>
    <p class="purchase-note">Si todavía vas a seguir comprando, no hace falta apartar: hazlo cuando ya tengas listo tu pedido final. Para dar seguimiento a tu pago necesitas iniciar sesión o crear una cuenta (correo y contraseña); tu compra por WhatsApp no lo requiere.</p>
    <div id="loginInline" hidden>
      <div class="form-grid">
        <div>
          <p class="purchase-note"><b>Ya tengo cuenta</b></p>
          <form id="formLoginInline"><label class="field"><span>Correo</span><input name="email" type="email" required autocomplete="username"></label>
          <label class="field"><span>Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
          <p id="errLoginInline" class="purchase-note" role="alert"></p>
          <button class="btn btn-block" type="submit">Entrar y confirmar</button></form>
        </div>
        <div>
          <p class="purchase-note"><b>Soy nuevo</b></p>
          <form id="formRegistroInline"><label class="field"><span>Nombre</span><input name="nombre" required maxlength="100" autocomplete="name"></label>
          <label class="field"><span>Correo</span><input name="email" type="email" required autocomplete="username"></label>
          <label class="field"><span>Contraseña</span><input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
          <p id="errRegistroInline" class="purchase-note" role="alert"></p>
          <button class="btn btn-block btn-ghost" type="submit">Crear cuenta y confirmar</button></form>
        </div>
      </div>
    </div>`}
    <a class="btn btn-block wa-buy" data-purchase="${encodeURIComponent(JSON.stringify(items))}" href="${purchaseURL(items)}" target="_blank" rel="noopener">Continuar compra por WhatsApp</a>
  </section>
  <section class="co-box transfer-box"><span class="eyebrow">DESPUÉS DE TRANSFERIR</span><h2>Envía tu comprobante</h2><p>Abre la conversación y adjunta la imagen o el PDF de tu comprobante usando el botón de adjuntar de WhatsApp.</p>
    <a class="btn btn-block btn-ghost receipt-buy" data-purchase="${encodeURIComponent(JSON.stringify(items))}" data-receipt="true" href="${purchaseURL(items,true)}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a>
    <p class="purchase-note">El mensaje incluye tus productos y cantidades. El dueño revisará el pago y acordará la entrega contigo.</p>
    ${autenticado?`<div id="comprobanteBox" style="margin-top:14px"></div>`:`<p class="purchase-note">O inicia sesión arriba y sube aquí mismo la imagen o PDF de tu comprobante, ligado a tu pedido, para que Damián lo vea directo en el panel.</p>`}
  </section>`;
  if(autenticado) mostrarSubidaComprobante();
  if(ready){document.getElementById('bankName').textContent=bank.banco;document.getElementById('bankOwner').textContent=bank.beneficiario;document.getElementById('bankType').textContent=bank.tipo||'Cuenta';document.getElementById('bankAccount').textContent=bank.cuenta;
    document.getElementById('copyAccount').onclick=async()=>{try{await navigator.clipboard.writeText(bank.cuenta);toast('Cuenta copiada');}catch{toast('Selecciona el número de cuenta para copiarlo');}};
  }
  document.getElementById('confirmCheckout')?.addEventListener('click',()=>{
    if(sbCustomerAuth.isAuthenticated()){ completarPedido(items); return; }
    document.getElementById('loginInline').hidden=false;
    document.getElementById('confirmCheckout').hidden=true;
  });
  document.getElementById('formLoginInline')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f=new FormData(e.target), err=document.getElementById('errLoginInline');
    err.textContent='';
    try{ await sbCustomerAuth.signIn(f.get('email').trim(), f.get('password')); await completarPedido(items); }
    catch(ex){ err.textContent='Correo o contraseña incorrectos.'; }
  });
  document.getElementById('formRegistroInline')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f=new FormData(e.target), err=document.getElementById('errRegistroInline');
    err.textContent='';
    try{ await sbCustomerAuth.signUpCliente({nombre:f.get('nombre').trim(), email:f.get('email').trim(), password:f.get('password')}); await completarPedido(items); }
    catch(ex){ err.textContent=ex.message||'No se pudo crear la cuenta.'; }
  });
  sum.innerHTML='<h3>Tu selección</h3>'+q.lines.map(i=>`<div class="transfer-item"><div>${cardArt(i.p)}</div><div><b>${i.p.marca}</b><p>${i.p.nombre}</p><small>${i.p.ml} · Cantidad: ${i.q}</small><p>${MONEDA(i.unit*i.q)} MXN</p></div></div>`).join('')+`
    <div class="sum-row"><span>Subtotal</span><span>${MONEDA(q.subtotal)}</span></div>
    ${q.wholesale?'<p class="purchase-note">Precio de mayoreo aplicado.</p>':''}
    <div class="sum-row"><span>${deliveryData().method==='personal'?'Entrega personal':'Envío por paquetería (estimado)'}</span><span>${deliveryData().method==='personal'?'Por confirmar':q.shipping?MONEDA(q.shipping):'Gratis'}</span></div>
    <div id="envioReal"></div>
    <div class="sum-row total"><span>${deliveryData().method==='personal'?'Subtotal sin entrega':'Total con paquetería'}</span><span>${MONEDA(deliveryData().method==='personal'?q.subtotal:q.total)}</span></div>
    <p class="purchase-note">Precios en MXN. Para entrega personal, acuerda ubicación, costo y horario por WhatsApp.</p>`;
  if(sbAuth.isAuthenticated()) actualizarEnvioReal(q.units);
}
/* Cotización real con Skydropx cuando ya hay CP, estado, ciudad y colonia.
   Oculta para clientes por ahora (sólo informativa para Damián mientras se
   conecta el pago en línea): sólo se calcula y se muestra si hay sesión de
   admin (mp_session) en este navegador — el cliente nunca la ve. */
let ultimaCotizacion=null;
async function actualizarEnvioReal(piezas){
  const box=document.getElementById('envioReal');if(!box||!sbAuth.isAuthenticated())return;
  const d=deliveryData();
  if(d.method!=='paqueteria'||!d.postcode||!d.estado||!d.city||!d.colonia){box.innerHTML='';ultimaCotizacion=null;return;}
  const clave=[d.postcode,d.estado,d.city,d.colonia,piezas||1].join('|');
  if(ultimaCotizacion&&ultimaCotizacion.clave===clave){pintarEnvioReal();return;}
  ultimaCotizacion={clave,cargando:true,tarifas:null,error:false};
  pintarEnvioReal();
  try{
    const r=await sbSkydrop.cotizar({cp_destino:d.postcode,estado:d.estado,ciudad:d.city,colonia:d.colonia,piezas:piezas||1});
    if(ultimaCotizacion.clave!==clave)return;
    ultimaCotizacion.cargando=false;
    ultimaCotizacion.tarifas=r?.tarifas||[];
  }catch(e){
    if(ultimaCotizacion.clave!==clave)return;
    ultimaCotizacion.cargando=false;ultimaCotizacion.error=true;
  }
  pintarEnvioReal();
}
function pintarEnvioReal(){
  const box=document.getElementById('envioReal');if(!box||!ultimaCotizacion)return;
  if(ultimaCotizacion.cargando){box.innerHTML='<p class="purchase-note">Calculando envío real con tu dirección…</p>';return;}
  if(ultimaCotizacion.error||!ultimaCotizacion.tarifas?.length){box.innerHTML='<p class="purchase-note">No se pudo calcular el envío real ahora mismo; usamos el estimado.</p>';return;}
  const mejor=ultimaCotizacion.tarifas[0];
  box.innerHTML=`<div class="sum-row"><span>Envío real (${esc(mejor.paqueteria)})</span><span>${MONEDA(mejor.costo)}</span></div><p class="purchase-note">${esc(mejor.servicio)} · ${mejor.dias} día(s) según Skydropx.</p>`;
}
const esc=v=>String(v??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* Confirmar pedido final: aparta el inventario (igual que hasta ahora) y además
   registra el pedido real ligado a la cuenta del cliente, para que Damián lo vea
   en el panel y el cliente pueda regresar a "Mi cuenta" a ver el estado y la guía. */
async function completarPedido(items){
  await apartarBolsa(items);
  try{
    const q=purchaseQuote(items);
    const s=sbCustomerAuth.session(), d=deliveryData();
    const id='PED-'+Date.now().toString(36).toUpperCase();
    await sbCustomerOrders.create({
      id,
      items: q.lines.map(l=>({id:l.id, q:l.q, price:l.unit})),
      status: 'Por preparar', payment: 'Por revisar', channel: 'Transferencia',
      method: d.method||'paqueteria', customer: s?.nombre||s?.email||'', recipient: d.recipient||'',
      city: d.city||'', address: d.address||'', reference: d.reference||'',
      date: new Date().toLocaleDateString('en-CA'), requested: '', confirmed: '', courier: '', tracking: '', example: false
    });
    pedidoConfirmado={id};
    toast('Pedido registrado. Sigue el estado y la guía en Mi cuenta.');
  }catch(e){
    toast('Se apartó tu pedido, pero no se pudo registrar en tu cuenta. Escríbenos por WhatsApp.');
  }
  renderTransfer();
}
/* Comprobante de pago: solo puede subirse cuando ya hay un pedido registrado
   ligado a la cuenta (el que se acaba de confirmar en esta visita, o el más
   reciente pendiente de revisión si el cliente regresó después). */
async function mostrarSubidaComprobante(){
  const box=document.getElementById('comprobanteBox'); if(!box) return;
  let pedido=pedidoConfirmado;
  if(!pedido){
    box.innerHTML='<p class="purchase-note">Cargando tu pedido…</p>';
    try{ pedido=(await sbCustomerOrders.mine()).find(o=>o.payment==='Por revisar'&&!o.comprobante_path); }
    catch(e){ pedido=null; }
  }
  if(!pedido){ box.innerHTML='<p class="purchase-note">Confirma tu pedido arriba para poder subir aquí tu comprobante.</p>'; return; }
  if(pedido.comprobante_path){ box.innerHTML=`<p class="purchase-note">✅ Ya recibimos tu comprobante del pedido ${esc(pedido.id)}.</p>`; return; }
  box.innerHTML=`<form id="formComprobante"><label class="field"><span>Comprobante del pedido ${esc(pedido.id)}</span><input type="file" name="archivo" accept="image/png,image/jpeg,image/webp,application/pdf" required></label>
    <p id="errComprobante" class="purchase-note" role="alert"></p>
    <button class="btn btn-block btn-ghost" type="submit">Subir comprobante</button></form>`;
  document.getElementById('formComprobante').addEventListener('submit', async e=>{
    e.preventDefault();
    const f=new FormData(e.target), file=f.get('archivo'), err=document.getElementById('errComprobante');
    err.textContent='';
    if(!file || !file.size){ err.textContent='Elige un archivo.'; return; }
    try{
      await sbComprobantes.subir(file, pedido.id);
      box.innerHTML=`<p class="purchase-note">✅ Comprobante recibido del pedido ${esc(pedido.id)}. Damián lo verá en el panel.</p>`;
      toast('Comprobante subido.');
    }catch(ex){ err.textContent=ex.message||'No se pudo subir el comprobante.'; }
  });
}
/* Si el cliente recarga la página justo después de confirmar (o vuelve más
   tarde con el mismo carrito), evitamos que el botón le deje crear un
   segundo pedido idéntico: si ya tiene un pedido pendiente con exactamente
   los mismos artículos, mostramos la confirmación en vez del botón. */
async function pageInit(){
  if(sbCustomerAuth.isAuthenticated()){
    try{
      const clave=items=>items.map(i=>i.id+':'+i.q).sort().join(',');
      const propia=clave(selectedPurchase());
      const activo=(await sbCustomerOrders.mine()).find(o=>o.payment==='Por revisar' && clave(o.items)===propia);
      if(activo) pedidoConfirmado={id:activo.id};
    }catch(e){}
  }
  renderTransfer();
}
</script></body></html>
